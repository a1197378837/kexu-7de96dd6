'+S.nodes.length+' 节点 / '+S.edges.length+' 连接 · 100%</span></div></div><div class="inspector">'+(n?'<div class="nodebadge">节点配置 / '+esc(n.type)+'</div><h3>'+esc(n.name)+'</h3>'+field('节点名称','<input id="nodeName" value="'+esc(n.name)+'">')+field(n.type==='代码'?'处理说明（受限数据表达式）':'配置内容','<textarea id="nodeText">'+esc(n.text)+'</textarea>')+field('输出变量','<input id="nodeVar" value="'+esc(n.variable||'output')+'">')+'<div class="row">'+btn('应用配置','updateNode()','primary')+btn('删除','deleteNode()','danger')+'</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>节点连接</h3>'+field('连接至','<select id="targetNode">'+S.nodes.filter(x=>x.id!==n.id).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select>')+btn('添加连接','addEdge()')+'<div class="gap tiny">当前输出连接</div>'+S.edges.filter(e=>e[0]===n.id).map(e=>'<div class="row between" style="margin-top:9px;font-size:11px">'+esc(S.nodes.find(x=>x.id===e[1])?.name||'')+'<button onclick="removeEdge(\''+e[0]+'\',\''+e[1]+'\')" style="padding:0 5px;border:0">×</button></div>').join('')+'<div class="notice gap">保存后，节点配置与连接关系将应用于此课程的学习助手。</div>':'<div class="empty">请添加或选择节点</div>')+'</div></div>'}
function bindCanvas(){$$('.palette [draggable]').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.type));$('#canvas').ondragover=e=>e.preventDefault();$('#canvas').ondrop=e=>{e.preventDefault();let b=$('#canvasInner').getBoundingClientRect();addNode(e.dataTransfer.getData('text/plain'),Math.max(10,e.clientX-b.left-50),Math.max(10,e.clientY-b.top-25))};$$('[data-node]').forEach(el=>el.onpointerdown=e=>{if(e.button!==0)return;let id=el.dataset.node,n=S.nodes.find(x=>x.id===id);selected=id;drag={id,x:e.clientX,y:e.clientY,ox:n.x,oy:n.y};el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{if(!drag)return;let node=S.nodes.find(x=>x.id===id);node.x=Math.max(5,Math.min(1200,drag.ox+ev.clientX-drag.x));node.y=Math.max(5,Math.min(390,drag.oy+ev.clientY-drag.y));el.style.left=node.x+'px';el.style.top=node.y+'px'};el.onpointerup=()=>{drag=null;save();render()}})}function addNode(type,x=45+S.nodes.length*13,y=320){if(!types.some(t=>t[0]===type))return;let id='n'+Date.now();S.nodes.push({id,type,name:type,text:types.find(t=>t[0]===type)[2],x:Math.min(x,1150),y:Math.min(y,390)});selected=id;save();render()}function updateNode(){let n=S.nodes.find(x=>x.id===selected);n.name=$('#nodeName').value.trim()||n.type;n.text=$('#nodeText').value;n.variable=$('#nodeVar').value.trim()||'output';save();render();toast('节点配置已应用')}function deleteNode(){S.nodes=S.nodes.filter(x=>x.id!==selected);S.edges=S.edges.filter(e=>!e.includes(selected));selected=S.nodes[0]?.id;save();render()}function addEdge(){let to=$('#targetNode').value;if(!to)return;if(S.edges.some(e=>e[0]===selected&&e[1]===to))return toast('该连接已存在');S.edges.push([selected,to]);save();render()}function removeEdge(a,b){S.edges=S.edges.filter(e=>e[0]!==a||e[1]!==b);save();render()}function flowSettings(){modal('工作流设置',field('智能体名称','<input id="flowName" value="'+esc(S.flowName)+'">')+field('关联课程','<select id="flowCourse"><option>航空电气基础</option><option>飞机维护技术</option><option>数字电子技术</option></select>')+btn('保存设置',"S.flowName=$('#flowName').value.trim()||S.flowName;S.flowCourse=$('#flowCourse').value;save();closeModal();render()",'primary'))}function openRun(){modal('试运行 · '+S.flowName,'<div class="notice">输入学习需求，查看各节点的执行结果与流程输出。</div>'+field('学习者输入','<textarea id="runInput">如何排查直流电路中的断路故障？</textarea>')+btn('开始运行','runFlow()','primary')+'<div id="runResult" class="gap"></div>',true)}function runFlow(){let input=$('#runInput').value.trim();if(!input)return toast('请输入学习需求');let indeg=Object.fromEntries(S.nodes.map(n=>[n.id,0]));S.edges.forEach(e=>{if(indeg[e[1]]!==undefined)indeg[e[1]]++});let q=S.nodes.filter(n=>indeg[n.id]===0),out=[];while(q.length){let n=q.shift();out.push(n);S.edges.filter(e=>e[0]===n.id).forEach(e=>{if(--indeg[e[1]]===0)q.push(S.nodes.find(x=>x.id===e[1]))})}if(out.length!==S.nodes.length){$('#runResult').innerHTML='<div class="notice">流程包含循环连接，请移除循环后重试。</div>';return}let results=out.map(n=>{let text=n.type==='问答'?input:n.type==='意图识别'?(input.includes('故障')?'故障排查':'知识理解'):n.type==='知识库'?'已匹配：电路故障诊断 / 万用表使用 / 断路检查':n.type==='条件选择器'?(input.includes('故障')?'进入故障排查分支':'进入知识讲解分支'):n.type==='动态选项'?'可选路径：基础原理、检测步骤、巩固练习':n.type==='代码'?'已提取输入长度：'+input.length+'；课程变量：'+S.flowCourse:'建议先确认电源安全状态，再检查线路连接，使用万用表分段测量，定位故障后修复并复测。请记录检测数据。';return {name:n.name,type:n.type,text}});runLogs.unshift({time:new Date().toLocaleString(),input,results});$('#runResult').innerHTML=results.map((r,i)=>'<div class="card" style="margin-top:8px;padding:13px"><div class="row between"><b>'+String(i+1).padStart(2,'0')+' '+esc(r.name)+'</b><span class="badge ok">执行完成</span></div><p class="muted gap">'+esc(r.text)+'</p></div>').join('')}function showRuns(){modal('工作流运行记录',runLogs.length?runLogs.map(r=>'<div class="card gap"><b>'+esc(r.input)+'</b><p class="muted">'+esc(r.time)+' · '+r.results.length+' 节点执行完成</p></div>').join(''):'<div class="empty">暂无运行记录，请先执行一次试运行。</div>')}
function navigationPage(){let role=S.navRole,nav=S.nav[role];return title('课程导航配置','统一设置教师端与学生端的课程栏目，配置即时预览',btn('新增导航','editNavigation(-1)','primary'))+'<div class="tabs"><button class="'+(role==='teacher'?'active':'')+'" onclick="S.navRole=\'teacher\';save();render()">教师端导航</button><button class="'+(role==='student'?'active':'')+'" onclick="S.navRole=\'student\';save();render()">学生端导航</button></div><div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr)"><section class="card"><div class="cardhead"><h2>栏目管理</h2><span class="muted">'+nav.length+' 个栏目 / '+nav.filter(n=>n.visible).length+' 个显示</span></div><table><thead><tr><th>排序</th><th>栏目名称</th><th>状态</th><th>调整顺序</th><th>操作</th></tr></thead><tbody>'+nav.map((n,i)=>'<tr><td>'+String(i+1).padStart(2,'0')+'</td><td><b>'+esc(n.name)+'</b>'+(n.custom?'<span class="badge" style="margin-left:5px">自定义</span>':'')+'</td><td><button onclick="toggleNav('+i+')">'+(n.visible?'显示':'隐藏')+'</button></td><td><button onclick="moveNav('+i+',-1)" '+(i===0?'disabled':'')+'>上移</button> <button onclick="moveNav('+i+',1)" '+(i===nav.length-1?'disabled':'')+'>下移</button></td><td><button onclick="editNavigation('+i+')">编辑</button></td></tr>').join('')+'</tbody></table></section><section><div class="card"><div class="cardhead"><h2>课程端预览</h2><span class="badge">'+(role==='teacher'?'教师':'学生')+'视角</span></div><div class="thumb" style="height:115px;font-size:18px">航空电气基础</div><p class="muted gap">'+nav.filter(n=>n.visible).length+' 个可见栏目 · 点击进入栏目</p><div class="navpreview gap">'+nav.filter(n=>n.visible).map(n=>'<a href="#" onclick="previewNav('+nav.indexOf(n)+');return false" title="'+esc(n.tip)+'">'+esc(n.name)+'</a>').join('')+'</div><div id="navContent" class="notice gap">从上方选择栏目查看内容。</div></div><div class="card gap"><h3>生效范围</h3><p class="muted gap">当前配置适用于'+(role==='teacher'?'全体教师':'全体学生')+'用户的课程导航。隐藏栏目不会删除栏目内的教学内容。</p>'+btn('保存并发布',"save();toast('导航配置已发布，刷新后仍保留')",'primary')+'</div></section></div>'}
function toggleNav(i){S.nav[S.navRole][i].visible=!S.nav[S.navRole][i].visible;save();render()}function moveNav(i,d){let a=S.nav[S.navRole];if(!a[i+d])return;[a[i],a[i+d]]=[a[i+d],a[i]];save();render()}function editNavigation(i){navEdit=i;let n=S.nav[S.navRole][i]||{name:'',url:'',tip:'',target:'inline'};modal(i<0?'新增自定义导航':'编辑导航',field('导航名称','<input id="navName" value="'+esc(n.name)+'" maxlength="24">')+field('链接地址','<input id="navUrl" value="'+esc(n.url)+'" placeholder="https:// 或 #课程栏目">')+field('导航提示','<input id="navTip" value="'+esc(n.tip)+'">')+field('打开方式','<select id="navTarget"><option value="inline">课程内打开</option><option value="_blank">新窗口打开</option><option value="_self">当前窗口打开</option></select>')+'<div class="row gap">'+btn('保存导航','saveNav()','primary')+btn('取消','closeModal()')+'</div>');$('#navTarget').value=n.target}
function saveNav(){let name=$('#navName').value.trim(),url=$('#navUrl').value.trim();if(!name||!url)return toast('请填写导航名称和链接地址');if(!/^(https?:\/\/|#)/i.test(url))return toast('链接仅支持 http、https 或课程内锚点');let a=S.nav[S.navRole],n={...(a[navEdit]||{visible:true,custom:true}),name,url,tip:$('#navTip').value,target:$('#navTarget').value};if(navEdit<0)a.push(n);else a[navEdit]=n;save();closeModal();render();toast('导航已保存')}function previewNav(i){let n=S.nav[S.navRole][i];if(n.custom&&/^https?:/.test(n.url)&&n.target!=='inline'){window.open(n.url,n.target,'noopener');return}$('#navContent').innerHTML='<b>'+esc(n.name)+'</b><p>'+esc(n.tip||'课程内容')+'</p>'+(n.custom?'<p>链接：'+esc(n.url)+'</p>':'<p>课程：航空电气基础 · 本栏目内容已加载</p>')}
function videoPage(){let c=S.capture;return title('视频学习监测','课程视频学习、身份核验与抓拍策略统一管理',btn('保存监测策略','saveCapture()','primary'))+'<div class="grid two"><section><div class="card"><div class="cardhead"><div><h2>直流电路的组成与测量</h2><p class="muted">航空电气基础 / 第二章 / 学员：陈宇</p></div><span class="badge '+(videoBlocked?'bad':'ok')+'">'+(videoBlocked?'学习已暂停':videoPlaying?'学习中':'待播放')+'</span></div><div class="video"><h2>直流电路 · 安全检测</h2><div class="schematic"><span>电源</span><i>—</i><span>线路</span><i>—</i><span>负载</span></div><small>'+(videoBlocked?'身份核验未通过，请重新核验后继续学习':videoPlaying?'正在学习：电路检测与仪表使用':'课程视频已就绪')+'</small></div><div class="progress"><i style="width:'+videoProgress+'%"></i></div><div class="row between"><span class="muted">'+Math.floor(videoProgress*18/100)+':'+String(Math.round(videoProgress*1080/100)%60).padStart(2,'0')+' / 18:00</span><span class="muted">学习进度 '+videoProgress+'%</span></div><div class="row wrap gap">'+btn(videoPlaying?'暂停':'播放',"videoEvent('toggle')",'primary')+btn('前进 1 分钟',"videoEvent('advance')")+btn('播放结束',"videoEvent('end')")+'</div><div class="notice gap" id="captureStatus">当前核验状态：'+(videoBlocked?'未通过，禁止继续学习':'正常，可继续学习')+'</div><div class="row wrap gap">'+btn('核验通过',"recordCapture('人工核验','通过')")+btn('核验失败',"recordCapture('身份核验','失败')")+btn('触发随机抓拍',"captureTrigger('random','随机抓拍')")+'</div></div><div class="card gap"><div class="cardhead"><h2>抓拍记录</h2><span class="muted">'+S.captureLogs.length+' 条记录</span></div><table><thead><tr><th>时间</th><th>触发事件</th><th>核验结果</th><th>处理结果</th></tr></thead><tbody>'+S.captureLogs.slice(0,12).map(l=>'<tr><td>'+esc(l.time)+'</td><td>'+esc(l.event)+'</td><td><span class="badge '+(l.result==='通过'?'ok':'bad')+'">'+l.result+'</span></td><td>'+esc(l.action)+'</td></tr>').join('')+'</tbody></table>'+(!S.captureLogs.length?'<div class="empty">开始学习后将生成抓拍记录</div>':'')+'</div></section><section class="card"><div class="cardhead"><h2>抓拍与识别策略</h2><span class="badge">课程级配置</span></div><form id="captureForm"><div class="checks" style="flex-direction:column;gap:15px">'+check('start','视频起始时抓拍',c.start)+check('play','视频播放时抓拍',c.play)+check('resume','暂停后再播放时抓拍',c.resume)+check('end','视频结束时抓拍',c.end)+check('timer','播放中定时抓拍',c.timer)+check('random','播放中随机抓拍',c.random)+'</div>'+field('定时抓拍间隔（分钟）','<input name="minutes" type="number" min="1" max="120" value="'+c.minutes+'">')+field('身份识别失败后的处理','<select name="failure"><option value="allow">记录异常并允许继续学习</option><option value="block">记录异常并禁止继续学习</option></select>')+'<div class="notice gap">抓拍策略应用于本课程全部视频任务。识别异常记录可在课程督导中追踪。</div><div class="gap">'+btn('应用策略','saveCapture()','primary')+'</div></form><div class="cardhead gap"><h3>关联学习任务</h3></div><div class="timeline"><div><b>课前准备</b><p class="muted">阅读安全操作规范</p></div><div><b>视频学习</b><p class="muted">18 分钟 · 需完成身份核验</p></div><div><b>课后巩固</b><p class="muted">电路故障诊断作业</p>'+btn('进入作业',"go('assignment')")+'</div></div></section></div>'}
function saveCapture(){let f=$('#captureForm'),c={...S.capture};['start','play','resume','end','timer','random'].forEach(k=>c[k]=f.elements[k].checked);let min=+f.elements.minutes.value;if(min<1||min>120)return toast('间隔请输入1至120分钟');c.minutes=min;c.failure=f.elements.failure.value;S.capture=c;save();toast('监测策略已保存')}function captureTrigger(k,label){if(S.capture[k])recordCapture(label,'通过');else toast('当前未启用'+label)}function recordCapture(event,result){let action=result==='通过'?'继续学习':S.capture.failure==='block'?'暂停学习，等待核验':'记录异常，允许学习';if(result==='失败'&&S.capture.failure==='block'){videoBlocked=true;videoPlaying=false}if(result==='通过')videoBlocked=false;S.captureLogs.unshift({time:new Date().toLocaleTimeString(),event,result,action});save();render()}
function videoEvent(type){if(videoBlocked&&type!=='end')return toast('请先完成身份核验');if(type==='toggle'){if(videoPlaying){videoPlaying=false}else{let first=!videoStarted;videoStarted=true;videoPlaying=true;if(first&&S.capture.start)S.captureLogs.unshift({time:new Date().toLocaleTimeString(),event:'视频起始',result:'通过',action:'继续学习'});if(!first&&S.capture.resume)S.captureLogs.unshift({time:new Date().toLocaleTimeString(),event:'暂停后再播放',result:'通过',action:'继续学习'});if(S.capture.play)S.captureLogs.unshift({time:new Date().toLocaleTimeString(),event:'视频播放',result:'通过',action:'继续学习'})}}else if(type==='advance'){if(!videoPlaying)return toast('请先播放视频');let prev=Math.floor(videoProgress*18/100);videoProgress=Math.min(100,videoProgress+6);let now=Math.floor(videoProgress*18/100);if(S.capture.timer&&Math.floor(now/S.capture.minutes)>Math.floor(prev/S.capture.minutes))S.captureLogs.unshift({time:new Date().toLocaleTimeString(),event:'定时抓拍（'+S.capture.minutes+'分钟）',result:'通过',action:'继续学习'});if(S.capture.random&&Math.random()>.4)S.captureLogs.unshift({time:new Date().toLocaleTimeString(),event:'随机抓拍',result:'通过',action:'继续学习'})}else{videoProgress=100;videoPlaying=false;if(S.capture.end)S.captureLogs.unshift({time:new Date().toLocaleTimeString(),event:'视频结束',result:'通过',action:'学习完成'})}save();render()}
function assignmentPage(){let w=S.work;return title('作业与互评','从发布规则到学生作答、同伴评阅与总评计算',btn('查看成绩','gradeReport()')+btn('保存作业设置','saveWork()','primary'))+'<div class="tabs"><button class="'+(jobTab==='teacher'?'active':'')+'" onclick="jobTab=\'teacher\';render()">教师设置</button><button class="'+(jobTab==='student'?'active':'')+'" onclick="jobTab=\'student\';render()">学生作答</button><button class="'+(jobTab==='peer'?'active':'')+'" onclick="jobTab=\'peer\';render()">同伴互评</button></div>'+(jobTab==='teacher'?'<form id="workForm"><div class="grid two"><section class="card"><div class="cardhead"><h2>作业内容与评分</h2><span class="badge">主观题</span></div>'+field('作业名称','<input name="name" value="'+esc(w.name)+'">')+field('标准答案','<textarea name="standard">'+esc(w.standard)+'</textarea>')+'<div class="grid two">'+field('最低分','<input type="number" name="min" value="'+w.min+'" min="0" max="100">')+field('最高分','<input type="number" name="max" value="'+w.max+'" min="0" max="100">')+'</div><div class="grid">'+field('教师批阅占比 %','<input type="number" name="teacher" value="'+w.teacher+'" min="0" max="100">')+field('学生互评占比 %','<input type="number" name="peer" value="'+w.peer+'" min="0" max="100">')+field('互评参与占比 %','<input type="number" name="participation" value="'+w.participation+'" min="0" max="100">')+'</div><div class="notice">三个评分维度的权重合计须为100%。总评按教师评分、互评平均分及参与完成度加权计算。</div>'+field('作答要求','<textarea name="requirements">'+esc(w.requirements)+'</textarea>')+field('评分设置','<textarea name="scoring">'+esc(w.scoring)+'</textarea>')+'</section><section class="card"><div class="cardhead"><h2>发布与作答控制</h2><span class="badge ok">课程作业</span></div><div class="grid two">'+field('发布时间','<input type="datetime-local" name="publish" value="'+w.publish+'">')+field('截止时间','<input type="datetime-local" name="deadline" value="'+w.deadline+'">')+'</div><div class="checks" style="flex-direction:column;gap:14px">'+check('answerPublic','向学生公开标准答案',w.answerPublic)+check('scorePublic','公开作业评分结果',w.scorePublic)+check('antiP function readWork(){let f=$('#workForm');if(!f)return false;let next={...S.work};['name','standard','requirements','scoring','publish','deadline','reminder'].forEach(k=>next[k]=f.elements[k].value);['teacher','peer','participation','min','max'].forEach(k=>next[k]=+f.elements[k].value);['answerPublic','scorePublic','antiPaste','late','redo','viewScore','showCorrect','shuffle'].forEach(k=>next[k]=f.elements[k].checked);if(next.teacher+next.peer+next.participation!==100){toast('教师、互评与参与权重合计必须为100%');return false}if(next.min<0||next.max>100||next.min>next.max){toast('请填写0至100内的有效评分范围');return false}if(next.deadline<next.publish){toast('截止时间不能早于发布时间');return false}S.work=next;return true}function saveWork(){if(!$('#workForm'))return toast('请在教师设置中保存作业规则');if(!readWork())return;save();toast('作业规则与评分设置已保存');render()}
function studentWork(){let w=S.work;return '<div class="grid two"><section class="card"><div class="cardhead"><div><h2>'+esc(w.name)+'</h2><p class="muted">截止 '+esc(w.deadline.replace('T',' '))+'</p></div><span class="badge '+(S.submitted?'ok':'')+'">'+(S.submitted?'已提交':'待完成')+'</span></div><p>'+esc(w.requirements)+'</p><div class="notice gap">'+(w.shuffle?'题目已按学习者独立排序 · ':'')+(w.antiPaste?'禁止粘贴答案 · ':'')+(w.late?'允许补交':'不允许补交')+'</div>'+field('作答内容','<textarea id="studentAnswer" style="min-height:180px" '+(S.submitted?'disabled':'')+'>'+esc(S.answer)+'</textarea>')+field('拍照上传答案','<input id="answerFile" type="file" accept="image/*" capture="environment" onchange="uploadAnswer(this)" '+(S.submitted?'disabled':'')+'>')+(S.answerImage?'<img class="answerimg" src="'+esc(S.answerImage)+'" alt="已上传的作业答案">':'')+'<div class="row gap">'+btn('提交作业','submitAnswer()','primary')+(S.submitted&&w.redo?btn('重新作答','redoAnswer()'):'')+'</div>'+(S.isRedo&&w.showCorrect?'<div class="notice gap">上次故障诊断题反馈：'+['断开电源','万用表','故障','复测'].map(k=>'<div>'+k+'：'+(S.answer.includes(k)?'正确，已覆盖':'待完善，未覆盖')+'</div>').join('')+'</div>':'')+'</section><section class="card"><div class="cardhead"><h2>学习反馈</h2></div><div class="timeline"><div><b>作答要求</b><p class="muted">独立完成，支持拍照上传手写答案。</p></div><div><b>评阅安排</b><p class="muted">教师评阅 '+w.teacher+'% / 同伴互评 '+w.peer+'% / 互评参与 '+w.participation+'%</p></div><div><b>反馈与成绩</b><p class="muted">'+(w.viewScore&&w.scorePublic?'成绩允许查看':'成绩暂不开放查看')+'</p></div></div>'+(w.answerPublic?'<div class="notice gap"><b>标准答案</b><p>'+esc(w.standard)+'</p></div>':'<div class="notice gap">标准答案将按教师设置开放。</div>')+(w.viewScore&&w.scorePublic?'<div class="stat gap"><small>当前综合得分</small><b>'+totalGrade().toFixed(1)+'</b></div>':'')+'</section></div>'}
function uploadAnswer(el){let f=el.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('请选择图片文件');if(f.size>2*1024*1024)return toast('图片请控制在2MB以内');let r=new FileReader();r.onload=()=>{S.answerImage=r.result;S.answer=$('#studentAnswer').value;save();render()};r.readAsDataURL(f)}function submitAnswer(){if(S.submitted)return toast('作业已提交');let now=new Date(),w=S.work;if(now<new Date(w.publish))return toast('作业尚未到发布时间');if(now>new Date(w.deadline)&&!w.late)return toast('作业已截止且不允许补交');let a=$('#studentAnswer').value.trim();if(!a&&!S.answerImage)return toast('请填写答案或上传照片');S.answer=a;S.submitted=true;save();render();toast('作业提交成功')}function redoAnswer(){if(!S.work.redo)return;S.submitted=false;save();render()}
function peerWork(){return '<div class="grid two"><section class="card"><div class="cardhead"><h2>同伴作答 · 学员 027</h2><span class="badge">匿名互评</span></div><p class="muted">作业：'+esc(S.work.name)+'</p><div class="notice gap">首先断开电源，检查导线与接头是否松动。使用万用表检测电源输出与线路通断，逐段定位异常，处理故障后重新测试。</div>'+field('评分（'+S.work.min+' 至 '+S.work.max+' 分）','<input id="peerScoreInput" type="number" min="'+S.work.min+'" max="'+S.work.max+'" value="'+S.peerScore+'">')+field('评阅意见','<textarea id="peerComment">'+esc(S.peerComment)+'</textarea>')+btn(S.peerDone?'更新互评':'提交互评','submitPeer()','primary')+'<div class="notice gap">'+(S.peerDone?'互评已完成，参与情况计入综合得分。':'完成同伴评分与评语后，互评参与情况将同步更新。')+'</div></section><section class="card"><div class="cardhead"><h2>智能辅助评阅</h2><span class="badge">教师确认</span></div>'+field('教师标准答案','<textarea id="analysisStandard">'+esc(S.work.standard)+'</textarea>')+field('当前学生答案','<textarea id="analysisAnswer">'+esc(S.answer)+'</textarea>')+btn('分析相似度与推荐得分','analyzeAnswer()','primary')+'<div id="analysisResult" class="gap"></div>'+field('教师批阅得分','<input id="teacherScoreInput" type="number" min="'+S.work.min+'" max="'+S.work.max+'" value="'+S.teacherScore+'">')+btn('确认教师评分','confirmTeacherScore()')+'</section></div>'}function submitPeer(){let s=+$('#peerScoreInput').value;if(s<S.work.min||s>S.work.max)return toast('互评分数超出教师设置范围');if(!$('#peerComment').value.trim())return toast('请填写评阅意见');S.peerScore=s;S.peerComment=$('#peerComment').value;S.peerDone=true;save();render();toast('互评已提交，参与得分已更新')}
function similarity(a,b){a=a.replace(/[\s，。,.、；;！!？?]/g,'');b=b.replace(/[\s，。,.、；;！!？?]/g,'');if(!a||!b)return 0;let grams=s=>s.length<2?[s]:Array.from({length:s.length-1},(_,i)=>s.slice(i,i+2));let x=grams(a),y=grams(b),counts={};y.forEach(t=>counts[t]=(counts[t]||0)+1);let matched=0;x.forEach(t=>{if(counts[t]>0){matched++;counts[t]--}});return 2*matched/(x.length+y.length)}function analyzeAnswer(){let v=similarity($('#analysisStandard').value,$('#analysisAnswer').value),score=Math.round(S.work.min+(S.work.max-S.work.min)*v);$('#analysisResult').innerHTML='<div class="notice"><div class="row between"><b>文本相似度 '+Math.round(v*100)+'%</b><b>推荐得分 '+score+'</b></div><p>请结合安全规范、步骤完整性与实际答题质量确认评分。</p></div>';$('#teacherScoreInput').value=score}function confirmTeacherScore(){let v=+$('#teacherScoreInput').value;if(v<S.work.min||v>S.work.max)return toast('教师评分超出设置范围');S.teacherScore=v;save();toast('教师评分已确认')}function totalGrade(){let w=S.work;return S.teacherScore*w.teacher/100+S.peerScore*w.peer/100+(S.peerDone?100:0)*w.participation/100}function gradeReport(){modal('作业成绩汇总','<table><tr><th>评分维度</th><th>原始分</th><th>权重</th><th>折算分</th></tr><tr><td>教师批阅</td><td>'+S.teacherScore+'</td><td>'+S.work.teacher+'%</td><td>'+(S.teacherScore*S.work.teacher/100).toFixed(1)+'</td></tr><tr><td>学生互评</td><td>'+S.peerScore+'</td><td>'+S.work.peer+'%</td><td>'+(S.peerScore*S.work.peer/100).toFixed(1)+'</td></tr><tr><td>互评参与</td><td>'+(S.peerDone?100:0)+'</td><td>'+S.work.participation+'%</td><td>'+(S.peerDone?S.work.participation:0).toFixed(1)+'</td></tr></table><div class="stat gap"><small>综合得分</small><b>'+totalGrade().toFixed(1)+'</b></div>')}

function coursesPage(){return title('课程中心','管理课程内容、教学任务与学习支持工具',btn('创建课程','createCourse()','primary'))+'<div class="stats"><div class="stat"><small>负责课程</small><b>04</b></div><div class="stat"><small>教学班级</small><b>09</b></div><div class="stat"><small>本周教学任务</small><b>18</b></div><div class="stat"><small>课程资源</small><b>286</b></div></div><div class="grid two">'+courses.map((c,i)=>'<section class="card"><div class="row between"><span class="badge">'+c.code+'</span><span class="badge ok">教学中</span></div><div class="thumb gap" style="height:110px;background:'+['#edf1ff','#ecf6fb','#f1effc','#eef5f4'][i]+'">'+['◎','▤','⊞','◇'][i]+'</div><h2 class="gap">'+c.name+'</h2><p class="muted">'+c.teacher+' · '+c.students+' 名学生 · '+c.room+'</p><div class="progress"><i style="width:'+c.progress+'%"></i></div><div class="row between"><span class="tiny">教学进度 '+c.progress+'%</span>'+btn('进入课程','courseDetail('+i+')')+'</div></section>').join('')+'</div>'}function courseDetail(i){let c=courses[i];modal(c.name,'<p class="muted">'+c.teacher+' · '+c.room+'</p><div class="notice gap">当前任务：'+c.task+'</div><div class="grid gap">'+btn('课程视频',"closeModal();go('video')")+btn('作业与互评',"closeModal();go('assignment')")+btn('课程智能体',"closeModal();go('flow')")+'</div><h3 class="gap">课程章节</h3><table><tr><td>01</td><td>课程导学与学习准备</td><td>已开放</td></tr><tr><td>02</td><td>基础原理与操作规范</td><td>学习中</td></tr><tr><td>03</td><td>实践应用与综合训练</td><td>已开放</td></tr></table>')}function createCourse(){modal('创建课程',field('课程名称','<input id="newCourseName" placeholder="请输入课程名称">')+field('所属学期','<select><option>2026秋季学期</option><option>2027春季学期</option></select>')+btn('创建',"if(!$('#newCourseName').value.trim()){toast('请输入课程名称')}else{S.notices.unshift({title:'新课程已创建：'+$('#newCourseName').value,text:'请继续完善章节与教学资源',time:new Date().toLocaleString()});save();closeModal();toast('课程草稿已建立，可在消息中心查看')}",'primary'))}
const resources=['航空电气安全操作规范.pdf','直流电路测量课件.pptx','故障诊断案例集.pdf','万用表操作微课.mp4','电子技术随堂题库','机体检查实训任务书.pdf'];function resourcesPage(){return title('资源中心','汇聚课程资料、知识库与教学工具',btn('上传资源','uploadResource()','primary'))+'<div class="card"><div class="row between"><div class="tabs" style="margin:0;border:0"><button class="active" onclick="filterResources(\'\')">全部资源</button><button onclick="filterResources(\'.pdf\')">教学文档</button><button onclick="filterResources(\'.mp4\')">视频资源</button><button onclick="filterResources(\'题库\')">试题资源</button></div><input id="resSearch" placeholder="搜索资源名称" oninput="filterResources(this.value)"></div><div id="resList" class="gap">'+resourceList('')+'</div></div>'}function resourceList(q){let list=resources.filter(n=>n.includes(q));return '<table><thead><tr><th>资源名称</th><th>所属课程</th><th>更新日期</th><th>操作</th></tr></thead><tbody>'+list.map(n=>'<tr><td><span class="node-icon" style="display:inline-grid;margin-right:10px">▤</span>'+esc(n)+'</td><td>航空电气基础</td><td>2026-10-24</td><td>'+btn('查看',"resourceView('"+esc(n)+"')")+'</td></tr>').join('')+'</tbody></table>'+(!list.length?'<div class="empty">没有匹配的资源</div>':'')}function filterResources(q){$('#resList').innerHTML=resourceList(q)}function resourceView(n){modal(n,'<div class="notice">已选资源：'+esc(n)+'</div><h3 class="gap">资源摘要</h3><p class="gap">本资源围绕课程教学目标，提供基础知识、安全操作、典型应用与学习练习。可与课程章节、作业任务及知识库关联使用。</p><div class="row gap">'+btn('关联到当前课程',"S.notices.unshift({title:'资源已关联："+esc(n)+"',text:'航空电气基础',time:new Date().toLocaleString()});save();closeModal();toast('资源关联已完成')",'primary')+'</div>')}function uploadResource(){modal('上传教学资源',field('选择本地文件','<input type="file" id="resourceFile">')+btn('上传',"let f=$('#resourceFile').files[0];if(!f){toast('请选择文件')}else{resources.unshift(f.name);closeModal();render();toast('资源已加入当前列表')}",'primary'))}
function analyticsPage(){return title('学习分析','汇总学习行为、任务完成与课程教学表现',btn('导出学习报告','exportReport()','primary'))+'<div class="stats"><div class="stat"><small>本周活跃学习者</small><b>284</b><small style="color:#43a98d">较上周 +12.6%</small></div><div class="stat"><small>平均任务完成率</small><b>82.4%</b></div><div class="stat"><small>有效学习时长</small><b>426 <small>小时</small></b></div><div class="stat"><small>互评参与人数</small><b>'+(186+(S.peerDone?1:0))+'</b></div></div><div class="grid two"><section class="card"><div class="cardhead"><h2>近七日学习活跃</h2><span class="muted">按日统计</span></div><div class="metricbar">'+[40,65,57,88,74,95,82].map((v,i)=>'<div style="height:'+v+'%"><small>10.'+(20+i)+'</small></div>').join('')+'</div><div style="height:35px"></div></section><section class="card"><div class="cardhead"><h2>课程任务完成情况</h2></div>'+courses.map(c=>'<div class="row between"><span style="font-size:12px">'+c.name+'</span><span class="muted">'+c.progress+'%</span></div><div class="progress" style="margin-bottom:18px"><i style="width:'+c.progress+'%"></i></div>').join('')+'</section></div><section class="card gap"><div class="cardhead"><h2>学习预警与跟进</h2><span class="badge warn">5 名学员待跟进</span></div><table><tr><th>学员</th><th>预警类型</th><th>关联课程</th><th>建议操作</th></tr>'+['赵晨','何明','孙宁'].map((n,i)=>'<tr><td>'+n+'</td><td>'+['连续三日未学习','作业逾期未提交','学习进度落后'][i]+'</td><td>'+courses[i].name+'</td><td>'+btn('发送督促',"S.notices.unshift({title:'已督促学员："+n+"',text:'请及时完成课程学习与作业任务',time:new Date().toLocaleString()});save();toast('督促记录已保存')")+'</td></tr>').join('')+'</table></section>'}function exportReport(){let text='课程,教师,学生数,学习完成率\n'+courses.map(c=>[c.name,c.teacher,c.students,c.progress+'%'].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'}));a.download='课程学习分析.csv';a.click();URL.revokeObjectURL(a.href);toast('学习报告已导出')}

const baseStudentWork=studentWork;studentWork=function(){let html=baseStudentWork();let extra='<div id="quizQuestions" class="gap"><div data-question="safety" class="notice" style="margin-bottom:12px"><b>安全规范题</b><p>电路检测前应首先执行哪一步？</p><label><input type="radio" name="safetyAnswer" value="disconnect" '+checked(S.safetyAnswer==='disconnect')+' onchange="S.safetyAnswer=this.value;save()" '+(S.submitted?'disabled':'')+'> 断开电源并确认安全</label><br><label><input type="radio" name="safetyAnswer" value="measure" '+checked(S.safetyAnswer==='measure')+' onchange="S.safetyAnswer=this.value;save()" '+(S.submitted?'disabled':'')+'> 立即进行带电测量</label>'+(S.isRedo&&S.work.showCorrect?'<p class="gap">上次作答：'+(S.safetyAnswer==='disconnect'?'正确':'错误，检测前应断开电源')+'</p>':'')+'</div></div>';html=html.replace('<label class="field"><span>作答内容</span>','<div id="longQuestion" data-question="diagnosis"><label class="field"><span>故障诊断题 · 作答内容</span>');html=html.replace('<label class="field"><span>拍照上传答案</span>','</div>'+extra+'<label class="field"><span>拍照上传答案</span>');html=html.replace(/题目已按学习者独立排序/g,S.work.shuffle?'题目已乱序：故障诊断题 / 安全规范题':'题目顺序：安全规范题 / 故障诊断题');return html};const baseRender=render;render=function(){baseRender();if(page==='assignment'&&jobTab==='student'){if(!S.work.shuffle){let long=$('#longQuestion'),quiz=$('#quizQuestions');if(long&&quiz)long.before(quiz)}let ta=$('#studentAnswer');if(ta)ta.oninput=()=>{S.answer=ta.value;save()}}if(page==='assignment'&&jobTab==='peer'&&S.answerImage){$('#analysisAnswer').insertAdjacentHTML('afterend','<img class="answerimg" alt="学生上传答案" src="'+esc(S.answerImage)+'">')}};
const baseReadWork=readWork;readWork=function(){if(!baseReadWork())return false;S.teacherScore=Math.max(S.work.min,Math.min(S.work.max,S.teacherScore));S.peerScore=Math.max(S.work.min,Math.min(S.work.max,S.peerScore));return true};redoAnswer=function(){if(!S.work.redo)return;S.submitted=false;S.isRedo=true;save();render()};const baseSubmit=submitAnswer;submitAnswer=function(){if(!S.safetyAnswer)return toast('请先完成安全规范题');baseSubmit()};const basePreview=previewNav;previewNav=function(i){let n=S.nav[S.navRole][i];if(/^https?:/.test(n.url)&&n.target==='inline'){let box=$('#navContent');box.innerHTML='<b>'+esc(n.name)+'</b><p>'+esc(n.tip)+'</p><iframe title="'+esc(n.name)+'" src="'+esc(n.url)+'" style="width:100%;height:260px;border:1px solid #e0e5f0;border-radius:5px;margin-top:10px" sandbox="allow-scripts allow-same-origin"></iframe><a style="display:block" href="'+esc(n.url)+'" target="_blank" rel="noopener">在新窗口查看</a>';return}basePreview(i)};

function actualNav(i){let n=S.nav[actualRole][i],box=$('#actualContent');box.innerHTML='<b>'+esc(n.name)+'</b><p>'+esc(n.tip)+'</p>';if(/^https?:/.test(n.url)){if(n.target==='inline')box.innerHTML+='<iframe src="'+esc(n.url)+'" title="'+esc(n.name)+'" style="width:100%;height:220px;border:1px solid #dce3ed"></iframe>';else box.innerHTML+='<a href="'+esc(n.url)+'" target="'+(n.target==='_blank'?'_blank':'_self')+'" rel="noopener">打开链接</a>'}else box.innerHTML+='<p>课程教学内容已加载。</p>'}
const originalReadWork=readWork;readWork=function(){let f=$('#workForm');if(f&&['teacher','peer','participation'].some(k=>!Number.isFinite(+f.elements[k].value)||+f.elements[k].value<0||+f.elements[k].value>100)){toast('权重必须在0到100之间');return false}return originalReadWork()};
const originalRun=runFlow;
runFlow=function(){originalRun();if(!$('#runResult')||$('#runResult').textContent.includes('循环'))return;let input=$('#runInput').value;let cards=$$('#runResult .card');let last=runLogs[0];if(!last)return;cards.forEach((el,i)=>{let result=last.results[i],n=S.nodes.find(n=>n.name===result?.name);if(!n)return;let text=result.text+'\n配置：'+n.text;if(n.type==='代码'){text='代码逻辑：'+n.text+'\n处理结果：'+(/length/.test(n.text)?input.length:input)}if(n.type==='动态选项')text='可选学习路径：'+n.text;if(n.type==='条件选择器')text='判断条件：'+n.text+'\n分支结果：'+(input.includes((n.text.split('：')[1]||'故障').trim())?'匹配':'不匹配');el.querySelector('p').textContent=text;result.text=text})};
